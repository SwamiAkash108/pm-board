<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PM Board</title>
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=30">
<link rel="stylesheet" href="apple.css?v=30">
</head>
<body>

<header id="topbar">
  <div class="brand">
    <img src="bm-logo-black.png" alt="Bhakti Marga emblem" class="brand-icon" width="38" height="38">
    <div class="brand-text">
      <span class="brand-name">PM Board</span>
      <span class="brand-sub">Bhakti Marga Operations</span>
    </div>
  </div>
  <button id="btn-people" class="icon-btn" title="People" aria-label="People"><span class="material-symbols-outlined">group</span></button>
  <button id="btn-add-project" class="icon-btn" title="New project" aria-label="New project"><span class="material-symbols-outlined">add</span></button>
  <button id="btn-refresh" class="icon-btn" title="Refresh" aria-label="Refresh"><span class="material-symbols-outlined">refresh</span></button>
</header>
<nav id="tabbar" aria-label="Main views">
  <button class="tab" data-view="today" title="Today"><span class="material-symbols-outlined tab-ico">light_mode</span><span>Today</span></button>
  <button class="tab" data-view="sync" title="Sync"><span class="material-symbols-outlined tab-ico">groups</span><span>Sync</span></button>
  <button class="tab active" data-view="board" title="Board"><span class="material-symbols-outlined tab-ico">view_kanban</span><span>Board</span></button>
  <button class="tab" data-view="list" title="Registry"><span class="material-symbols-outlined tab-ico">table</span><span>Registry</span></button>
  <button class="tab" data-view="timeline" title="Voyage"><span class="material-symbols-outlined tab-ico">view_timeline</span><span>Voyage</span></button>
  <button class="tab" data-view="charts" title="Ledger"><span class="material-symbols-outlined tab-ico">bar_chart</span><span>Ledger</span></button>
  <button class="tab" data-view="updates" title="Chat" style="display:none"><span class="material-symbols-outlined tab-ico">forum</span><span>Chat</span></button>
</nav>
<div class="filterbar">
  <div id="area-chips" class="area-chips"></div>
  <div id="project-chips" class="project-chips"></div>
</div>

<main id="main">

  <!-- BOARD -->
  <section id="view-board" class="view active">
    <h2 class="view-title">The <em>board</em></h2>
    <div id="board" class="board"></div>
  </section>

  <!-- LIST (Registry) -->
  <section id="view-today" class="view">
    <h2 class="view-title">The <em>day</em></h2>
    <div id="today-wrap"></div>
  </section>

  <!-- SYNC -->
  <section id="view-sync" class="view">
    <h2 class="view-title">The <em>sync</em></h2>
    <div id="sync-wrap"></div>
  </section>

  <section id="view-list" class="view">
    <h2 class="view-title">The <em>registry</em></h2>
    <div id="list-wrap"></div>
  </section>

  <!-- TIMELINE -->
  <section id="view-timeline" class="view">
    <h2 class="view-title">The <em>voyage</em></h2>
    <label class="hide-done tl-hidetoggle"><input type="checkbox" id="tl-hide-uns"> hide unscheduled tasks</label>
    <div class="tl-scroll"><div class="tl-wrap" id="timeline-wrap"></div></div>
    <div id="uns-wrap"></div>
  </section>

  <!-- CHARTS -->
  <section id="view-charts" class="view">
    <h2 class="view-title">The <em>ledger</em></h2>
    <div class="charts">
      <div class="panel"><h3>By status</h3><div id="chart-status"></div></div>
      <div class="panel"><h3>Activity · 14 days</h3><div id="chart-activity"></div></div>
      <div class="panel"><h3>Per project</h3><div id="chart-projects"></div></div>
      <div class="panel"><h3>Overdue</h3><div id="chart-overdue"></div></div>
    </div>
  </section>

  <!-- UPDATES -->
  <section id="view-updates" class="view">
    <h2 class="view-title">The <em>chat</em></h2>
    <div class="chat-wrap" id="chat-wrap"></div>
    <div class="chat-input-row">
      <input id="chat-input" type="text" placeholder="Message Fluso… (same thread as Telegram)" autocomplete="off">
      <button id="chat-send" class="btn-accent">Send</button>
    </div>
  </section>

</main>

<button id="fab" title="New task">+</button>

<!-- Login -->
<div id="login" class="login hidden">
  <div class="login-card">
    <img src="bm-mark.png" alt="Bhakti Marga" class="login-icon">
    <h2>PM Board</h2>
    <p class="muted">field logbook · sign in to your board</p>
    <input id="login-email" type="email" placeholder="Email" autocomplete="email">
    <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="login-btn" class="btn-accent">Sign in</button>
    <p id="login-err" class="login-err"></p>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="db.js?v=30"></script>
<script src="app.js?v=30"></script>
</body>
</html>
